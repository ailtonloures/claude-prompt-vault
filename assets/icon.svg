<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="dial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- vault door outer ring -->
  <circle cx="256" cy="248" r="150" fill="none" stroke="url(#accent)" stroke-width="14"/>
  <circle cx="256" cy="248" r="150" fill="#1E1B4B" opacity="0.15"/>

  <!-- vault door face -->
  <circle cx="256" cy="248" r="122" fill="url(#dial)"/>

  <!-- dial bolts -->
  <circle cx="256" cy="140" r="10" fill="#4C1D95"/>
  <circle cx="256" cy="356" r="10" fill="#4C1D95"/>
  <circle cx="148" cy="248" r="10" fill="#4C1D95"/>
  <circle cx="364" cy="248" r="10" fill="#4C1D95"/>
  <circle cx="180" cy="172" r="9" fill="#4C1D95"/>
  <circle cx="332" cy="172" r="9" fill="#4C1D95"/>
  <circle cx="180" cy="324" r="9" fill="#4C1D95"/>
  <circle cx="332" cy="324" r="9" fill="#4C1D95"/>

  <!-- inner hub -->
  <circle cx="256" cy="248" r="58" fill="#1E1B4B"/>

  <!-- prompt symbol ">" and cursor "_" -->
  <path d="M 232 222 L 258 248 L 232 274" fill="none" stroke="#22D3EE" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="270" y="266" width="34" height="10" rx="5" fill="#22D3EE"/>

  <!-- chat bubble tail turning the vault into a "saved prompt" -->
  <path d="M 168 372 C 168 372 158 412 130 430 C 168 430 196 414 210 396 Z" fill="url(#dial)"/>

  <!-- small padlock badge -->
  <g transform="translate(356,360)">
    <rect x="-26" y="-4" width="52" height="42" rx="10" fill="url(#accent)"/>
    <path d="M -14 -4 L -14 -20 C -14 -34 14 -34 14 -20 L 14 -4" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="0" cy="16" r="7" fill="#1E1B4B"/>
  </g>
</svg>
